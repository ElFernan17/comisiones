<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calculadora de Comisiones</title>
    <link rel="stylesheet" href="ventas.css">
</head>
<body>

    <main class="contenedor">
        <h1>Calculadora de Comisiones</h1>

        <div class="campo">
            <label for="txtSueldoBase">Salario base</label>
            <input type="text" id="txtSueldoBase" inputmode="decimal" autocomplete="off">
        </div>

        <div class="campo">
            <label for="txtVentas">Número de ventas</label>
            <input type="text" id="txtVentas" inputmode="numeric" autocomplete="off">
        </div>

        <div class="campo">
            <label for="txtPrecio">Precio del producto</label>
            <input type="text" id="txtPrecio" inputmode="decimal" autocomplete="off">
        </div>

        <button type="button" onclick="calcular();">Calcular comisión</button>

        <section class="resultados">
            <h2>Resultados</h2>
            <p>Salario base <span id="spSueldoBase"></span></p>
            <p>Comisión <span id="spComision"></span></p>
            <p class="total">Total <span id="spTotal"></span></p>
        </section>
    </main>

    <script src="ventas.js"></script>
    <script src="utilidades.js"></script>
</body>
</html>
